<svg xmlns="http://www.w3.org/2000/svg" width="800" height="58" viewBox="0 0 800 58" role="img" aria-label="Mais sobre mim">
  <defs><style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .f{opacity:0;animation:in .8s cubic-bezier(.16,1,.3,1) forwards}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .glint{animation:glint 4s ease-in-out infinite}
      @keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.f{animation:none;opacity:1}.glint{animation:none}}
    </style></defs>
  <rect x=".5" y=".5" width="799" height="57" rx="12.5" fill="#f6f8fa" stroke="#d8dee4"/>
  <rect class="glint" x="1" y="17" width="2.5" height="24" rx="1.25" fill="#e5541b"/>
  <text x="24" y="35" class="sans" font-size="16" font-weight="600" letter-spacing="-.3" fill="#1f2328">Mais sobre mim</text>
  <text x="776" y="34" class="mono" font-size="11" fill="#6e7781" text-anchor="end">percurso · abrir <tspan fill="#e5541b">↓</tspan></text>
</svg>
