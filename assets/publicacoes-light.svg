<svg xmlns="http://www.w3.org/2000/svg" width="850" height="336" viewBox="0 0 850 336" role="img" aria-label="Publicações: dois artigos de 2025 sobre a plataforma Skye, no IADIS e no IJWI.">
  <defs><style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .f{opacity:0;animation:in .8s cubic-bezier(.16,1,.3,1) forwards}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .glint{animation:glint 4s ease-in-out infinite}
      @keyframes glint{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.f{animation:none;opacity:1}.glint{animation:none}}
    </style></defs>
  <rect x=".5" y=".5" width="849" height="335" rx="15.5" fill="#ffffff" stroke="#d8dee4"/>
  <text x="28" y="34" class="mono f" font-size="11.5" fill="#e5541b">// publicações</text>
  <text x="822" y="34" class="mono f" font-size="11" fill="#6e7781" text-anchor="end">avaliação de utilidade e usabilidade · Skye</text>
  <g class="f" style="animation-delay:0.15s">
    <rect x="24" y="52" width="802" height="128" rx="12" fill="#f6f8fa" stroke="#d8dee4"/>
    <rect x="44" y="72" width="64" height="24" rx="6" fill="#0969da" fill-opacity=".14" stroke="#0969da" stroke-opacity=".55"/>
    <text x="76" y="88" class="mono" font-size="11" font-weight="600" fill="#0969da" text-anchor="middle">IADIS</text>
    <text x="124" y="88" class="mono" font-size="11" fill="#6e7781">IADIS International Conference · 2025</text>
    <text class="sans" font-size="15.5" font-weight="600" letter-spacing="-.2" fill="#1f2328"><tspan x="44" y="118">Digital Platforms and Mental Health: Utility and Usability</tspan><tspan x="44" y="138">Assessment of the Skye Platform</tspan></text>
    <text x="44" y="162" class="mono" font-size="10.5" fill="#6e7781">R. Mendes, A. Veloso, D. Sena, D. Guerra, <tspan fill="#e5541b">R. Teixeira</tspan>, S. Luís</text>
  </g>
  <g class="f" style="animation-delay:0.30s">
    <rect x="24" y="194" width="802" height="128" rx="12" fill="#f6f8fa" stroke="#d8dee4"/>
    <rect x="44" y="214" width="64" height="24" rx="6" fill="#8250df" fill-opacity=".14" stroke="#8250df" stroke-opacity=".55"/>
    <text x="76" y="230" class="mono" font-size="11" font-weight="600" fill="#8250df" text-anchor="middle">IJWI</text>
    <text x="124" y="230" class="mono" font-size="11" fill="#6e7781">IADIS International Journal on WWW/Internet · 2025</text>
    <text class="sans" font-size="15.5" font-weight="600" letter-spacing="-.2" fill="#1f2328"><tspan x="44" y="260">Skye Platform: Utility and Usability Assessment for Supporting</tspan><tspan x="44" y="280">Blended Psychological Interventions</tspan></text>
    <text x="44" y="304" class="mono" font-size="10.5" fill="#6e7781">R. Mendes, A. Veloso, D. Sena, D. Guerra, <tspan fill="#e5541b">R. Teixeira</tspan>, S. Luís</text>
  </g>
</svg>
