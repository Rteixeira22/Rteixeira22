<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" viewBox="0 0 850 300" role="img" aria-label="Rodrigo Teixeira — Full-stack developer. Backend, arquiteturas orientadas a eventos e IA em produção.">
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .f{opacity:0;animation:in .8s cubic-bezier(.16,1,.3,1) forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.9s}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
      @keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
      .cursor{animation:blink 1.1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .flow{stroke-dasharray:4 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-28}}
      .svc{transition:none}
      @media (prefers-reduced-motion: reduce){
        .f{animation:none;opacity:1}
        .ping,.cursor,.flow{animation:none}
        .pulse{display:none}
      }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d8dee4" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="70%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="850" height="300" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#e5541b" stop-opacity=".16"/>
      <stop offset="1" stop-color="#e5541b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#e5541b"/>
      <stop offset="1" stop-color="#f2853f"/>
    </linearGradient>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="card"><rect width="850" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="850" height="300" fill="#ffffff"/>
    <rect width="850" height="300" fill="url(#grid)" mask="url(#gridMask)"/>
    <rect width="850" height="300" fill="url(#glow)"/>
  </g>
  <rect x=".5" y=".5" width="849" height="299" rx="15.5" fill="none" stroke="#d8dee4"/>

  <!-- esquerda: identidade -->
  <g class="f d1">
    <rect x="36" y="40" width="290" height="28" rx="14" fill="#f6f8fa" stroke="#d8dee4"/>
    <circle class="ping" cx="53" cy="54" r="3.5" fill="#1a8f5a"/>
    <circle cx="53" cy="54" r="3.5" fill="#1a8f5a"/>
    <text x="65" y="58" class="mono" font-size="11.5" fill="#59636e">disponível para novas oportunidades</text>
  </g>
  <text x="34" y="128" class="sans f d2" font-size="46" font-weight="700" letter-spacing="-1.8" fill="#1f2328">Rodrigo Teixeira</text>
  <text x="36" y="164" class="sans f d3" font-size="22" font-weight="600" letter-spacing="-.6" fill="url(#accent)">Full-stack developer.</text>
  <text class="sans f d4" font-size="14.5" fill="#59636e">
    <tspan x="36" y="200">Backend, arquiteturas orientadas a eventos</tspan>
    <tspan x="36" y="221">e IA em produção · Universidade de Aveiro</tspan>
  </text>
  <g class="f d5">
    <text x="36" y="262" class="mono" font-size="12.5" fill="#6e7781"><tspan fill="#e5541b">❯</tspan> microserviços · observabilidade · LLMs</text>
    <rect class="cursor" x="337" y="251" width="7" height="14" fill="#e5541b"/>
  </g>

  <!-- direita: event bus decorativo -->
  <g class="f d6">

    <!-- ligações -->
    <g stroke="#c2c9d1" stroke-width="1.2" fill="none">
      <path d="M534 118V170M650 118V170M766 118V170M534 170V222M650 170V222M766 170V222"/>
      <path d="M470 170H830" stroke-width="1.6"/>
    </g>
    <path class="flow" d="M470 170H830" stroke="#e5541b" stroke-opacity=".55" stroke-width="1.6" fill="none"/>
    <text x="470" y="188" class="mono" font-size="10" fill="#e5541b" fill-opacity=".8">rabbitmq</text>

    <!-- serviços -->
    <g class="mono" font-size="11" text-anchor="middle" fill="#1f2328">
      <g>
        <rect x="486" y="92" width="96" height="26" rx="7" fill="#f6f8fa" stroke="#c2c9d1"/>
        <text x="534" y="109">api-gateway</text>
      </g>
      <g>
        <rect x="602" y="92" width="96" height="26" rx="7" fill="#f6f8fa" stroke="#c2c9d1"/>
        <text x="650" y="109">auth</text>
      </g>
      <g>
        <rect x="718" y="92" width="96" height="26" rx="7" fill="#f6f8fa" stroke="#c2c9d1"/>
        <text x="766" y="109">ai-agent</text>
      </g>
      <g>
        <rect x="486" y="222" width="96" height="26" rx="7" fill="#f6f8fa" stroke="#c2c9d1"/>
        <text x="534" y="239">notify</text>
      </g>
      <g>
        <rect x="602" y="222" width="96" height="26" rx="7" fill="#f6f8fa" stroke="#c2c9d1"/>
        <text x="650" y="239">recommender</text>
      </g>
      <g>
        <rect x="718" y="222" width="96" height="26" rx="7" fill="#f6f8fa" stroke="#c2c9d1"/>
        <text x="766" y="239">telemetry</text>
      </g>
    </g>
    <g fill="#1a8f5a">
      <circle cx="575" cy="99" r="2.2"/><circle cx="691" cy="99" r="2.2"/><circle cx="807" cy="99" r="2.2"/>
      <circle cx="575" cy="229" r="2.2"/><circle cx="691" cy="229" r="2.2"/><circle cx="807" cy="229" r="2.2"/>
    </g>

    <!-- mensagens a circular -->
    <g class="pulse">
      <g>
        <circle r="5" fill="#e5541b" filter="url(#soft)"/><circle r="2.8" fill="#f2853f"/>
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M534 118V170H766V222"/>
      </g>
      <g>
        <circle r="5" fill="#e5541b" filter="url(#soft)"/><circle r="2.8" fill="#f2853f"/>
        <animateMotion dur="2.6s" begin="-0.9s" repeatCount="indefinite" path="M650 118V170H534V222"/>
      </g>
      <g>
        <circle r="5" fill="#8250df" filter="url(#soft)"/><circle r="2.8" fill="#8250df"/>
        <animateMotion dur="2.8s" begin="-1.7s" repeatCount="indefinite" path="M766 118V170H650V222"/>
      </g>
      <g>
        <circle r="5" fill="#0969da" filter="url(#soft)"/><circle r="2.8" fill="#0969da"/>
        <animateMotion dur="3.4s" begin="-0.4s" repeatCount="indefinite" path="M534 222V170H766V118"/>
      </g>
      <g>
        <circle r="5" fill="#1a8f5a" filter="url(#soft)"/><circle r="2.8" fill="#1a8f5a"/>
        <animateMotion dur="3s" begin="-2.2s" repeatCount="indefinite" path="M766 222V170H650V118"/>
      </g>
    </g>
  </g>
</svg>
