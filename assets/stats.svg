<svg xmlns="http://www.w3.org/2000/svg" width="850" height="176" viewBox="0 0 850 176" role="img" aria-label="Em números: 10+ microserviços em produção, 2 artigos publicados em 2025, 1 assistente de IA multi-agente, 5 projetos do backend ao mobile.">
  <defs>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .f{opacity:0;animation:in .8s cubic-bezier(.16,1,.3,1) forwards}
      .d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}.d5{animation-delay:.65s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
      @keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
      .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.16,1,.3,1) forwards}
      @keyframes grow{to{transform:scaleX(1)}}
      @media (prefers-reduced-motion: reduce){
        .f{animation:none;opacity:1}
        .ping{animation:none}
        .bar{animation:none;transform:none}
      }
    </style>
  </defs>

  <rect x=".5" y=".5" width="849" height="175" rx="15.5" fill="#09090b" stroke="#24242a"/>
  <g class="f d1">
    <text x="28" y="34" class="mono" font-size="11.5" fill="#ff7a45">// em números</text>
    <text x="822" y="34" class="mono" font-size="11" fill="#7d7d87" text-anchor="end">status: operacional</text>
  </g>

  <!-- 4 painéis -->
  <g class="f d2">
    <rect x="24" y="48" width="191" height="110" rx="11" fill="#111114" stroke="#24242a"/>
    <rect class="bar" x="24.5" y="48.5" width="190" height="2" fill="#ff7a45" style="animation-delay:.3s"/>
    <text x="42" y="72" class="mono" font-size="10.5" fill="#7d7d87">services_up</text>
    <circle class="ping" cx="197" cy="68.5" r="3" fill="#3ecf8e"/><circle cx="197" cy="68.5" r="3" fill="#3ecf8e"/>
    <text x="40" y="112" class="sans" font-size="36" font-weight="650" letter-spacing="-1.4" fill="#ededef">10+</text>
    <text class="sans" font-size="12.5" fill="#a1a1aa"><tspan x="42" y="134">microserviços em</tspan><tspan x="42" y="149">produção no Ser+</tspan></text>
  </g>
  <g class="f d3">
    <rect x="227" y="48" width="191" height="110" rx="11" fill="#111114" stroke="#24242a"/>
    <rect class="bar" x="227.5" y="48.5" width="190" height="2" fill="#5aa9ff" style="animation-delay:.45s"/>
    <text x="245" y="72" class="mono" font-size="10.5" fill="#7d7d87">papers_total</text>
    <text x="243" y="112" class="sans" font-size="36" font-weight="650" letter-spacing="-1.4" fill="#ededef">2</text>
    <text class="sans" font-size="12.5" fill="#a1a1aa"><tspan x="245" y="134">artigos científicos</tspan><tspan x="245" y="149">publicados em 2025</tspan></text>
  </g>
  <g class="f d4">
    <rect x="430" y="48" width="191" height="110" rx="11" fill="#111114" stroke="#24242a"/>
    <rect class="bar" x="430.5" y="48.5" width="190" height="2" fill="#a78bfa" style="animation-delay:.6s"/>
    <text x="448" y="72" class="mono" font-size="10.5" fill="#7d7d87">ai_agents</text>
    <circle class="ping" cx="603" cy="68.5" r="3" fill="#a78bfa" style="animation-delay:.7s"/><circle cx="603" cy="68.5" r="3" fill="#a78bfa"/>
    <text x="446" y="112" class="sans" font-size="36" font-weight="650" letter-spacing="-1.4" fill="#ededef">1</text>
    <text class="sans" font-size="12.5" fill="#a1a1aa"><tspan x="448" y="134">assistente de IA</tspan><tspan x="448" y="149">multi-agente em produção</tspan></text>
  </g>
  <g class="f d5">
    <rect x="633" y="48" width="193" height="110" rx="11" fill="#111114" stroke="#24242a"/>
    <rect class="bar" x="633.5" y="48.5" width="192" height="2" fill="#f5b54a" style="animation-delay:.75s"/>
    <text x="651" y="72" class="mono" font-size="10.5" fill="#7d7d87">projects</text>
    <text x="649" y="112" class="sans" font-size="36" font-weight="650" letter-spacing="-1.4" fill="#ededef">5</text>
    <text class="sans" font-size="12.5" fill="#a1a1aa"><tspan x="651" y="134">projetos, do backend</tspan><tspan x="651" y="149">ao mobile</tspan></text>
  </g>
</svg>
